<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#070b12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="المعتمد">
<meta name="apple-mobile-web-app-title" content="المعتمد">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<title>المعتمد</title>
<style>
:root{--bg:#070b12;--p1:#0d1220;--p2:#121828;--p3:#19212f;--p4:#1f2a3c;--g:#00d97e;--gold:#f5b932;--red:#ff5d5d;--blu:#4da3ff;--tx:#eef2f8;--tx2:#a5b0c2;--tx3:#6b778c;--ln:#222d40;--ln2:#2c3a52;--ff:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;--fn:'Cairo','Segoe UI',sans-serif}
body.light{--bg:#eef1f6;--p1:#ffffff;--p2:#ffffff;--p3:#f2f5fa;--p4:#e4e9f2;--g:#00995a;--gold:#a87200;--red:#d63b3b;--blu:#1f6fd0;--tx:#111827;--tx2:#45536a;--tx3:#7a879b;--ln:#dde3ee;--ln2:#c7d0e0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:var(--ff);transition:background .3s,color .3s}
body{overflow:hidden}
button,input,select,textarea{font-family:var(--ff)}
#app{position:fixed;top:0;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:var(--bg);overflow:hidden;transition:background .3s}
.scr{position:absolute;inset:0;display:none;flex-direction:column;padding-bottom:calc(60px + env(safe-area-inset-bottom))}
.scr.on{display:flex;animation:fu .3s}
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hdr{display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;background:linear-gradient(180deg,var(--p3),var(--p1));border-bottom:2px solid var(--g);flex:none;transition:all .3s}
.brand{font:800 20px var(--fn);color:var(--g);line-height:1.1}
.brand small{display:block;font:600 10px var(--ff);color:var(--tx3);letter-spacing:.3px;white-space:nowrap}
.hb{display:flex;gap:6px}
.cp{border:1px solid var(--ln2);background:var(--p3);color:var(--tx);border-radius:20px;padding:7px 9px;font:700 12px var(--ff);min-width:38px;line-height:1.2}
.cp.on{border-color:var(--g);color:var(--g)}
.sb{padding:10px 12px 6px;flex:none}
.in{width:100%;background:var(--p3);border:1px solid var(--ln2);border-radius:12px;color:var(--tx);padding:12px;font:600 14px var(--ff);outline:none;transition:border .2s}
.in:focus{border-color:var(--g)}
.in.big{font-size:16px;padding:14px}
.in::placeholder{color:var(--tx3);font-weight:400}
textarea.in{resize:none;min-height:60px}
.ltr{direction:ltr;text-align:right}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 12px 10px;scrollbar-width:none;flex:none}
.chips::-webkit-scrollbar{display:none}
.ch{flex:none;border:1px solid var(--ln2);background:var(--p2);color:var(--tx2);border-radius:20px;padding:7px 14px;font:700 12px var(--ff)}
.ch.on{background:var(--g);color:#04150d;border-color:var(--g)}
.scrl{flex:1;overflow-y:auto;padding:4px 0 90px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.scrl::-webkit-scrollbar{display:none}
.card{background:var(--p2);border:1px solid var(--ln);border-radius:14px;padding:12px;margin:0 12px 10px;transition:all .3s}
.pc{display:grid;grid-template-columns:1fr auto;gap:4px 10px;border-right:4px solid var(--g);cursor:pointer}
.pc.y{border-right-color:var(--gold)}.pc.r{border-right-color:var(--red)}
.pc:active{background:var(--p3)}
.pn{font-weight:800;font-size:15px;line-height:1.35}
.pr{font:600 12px monospace;direction:ltr;text-align:right;color:var(--tx2)}
.pv{font-size:12px;color:var(--tx3)}
.pp{font-weight:800;color:var(--g);font-size:16px;text-align:left;white-space:nowrap}
.pq{font-size:12px;font-weight:700;text-align:left;color:var(--g)}
.pq.y{color:var(--gold)}.pq.r{color:var(--red)}
.pc3{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.bd{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--p4);color:var(--tx2)}
.bd.o{background:rgba(0,217,126,.15);color:var(--g)}
.bd.c{background:rgba(245,185,50,.16);color:var(--gold)}
.bd.sf{color:var(--blu)}.bd.bz{color:var(--gold)}.bd.rd{background:rgba(255,93,93,.15);color:var(--red)}
.btn{border:0;border-radius:12px;padding:12px 16px;font:700 14px var(--ff);background:var(--p4);color:var(--tx);cursor:pointer}
.btn:active{opacity:.8}
.btn:disabled{opacity:.5}
.btn-g{background:var(--g);color:#04150d}
.btn-r{background:rgba(255,93,93,.15);color:var(--red)}
.btn-fw{width:100%}
.btn-s{padding:8px 12px;font-size:12px}
.row{display:flex;gap:8px}.row>*{flex:1}
.fab{position:absolute;left:16px;bottom:calc(74px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--g);color:#04150d;font-size:30px;font-weight:700;box-shadow:0 6px 20px rgba(0,217,126,.35);z-index:15;display:none;line-height:1}
.fab.on{display:block}
.nav{position:absolute;bottom:0;left:0;right:0;display:flex;background:var(--p1);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom);z-index:20;transition:all .3s}
.nav button{flex:1;border:0;background:none;color:var(--tx3);padding:8px 2px 6px;font:700 10px var(--ff);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.nav button.on{color:var(--g)}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bdg{position:absolute;top:3px;right:calc(50% - 20px);background:var(--red);color:#fff;font-size:10px;border-radius:10px;padding:1px 6px;display:none}
.bdg.on{display:block}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:2px 12px 10px}
.kp{background:var(--p2);border:1px solid var(--ln);border-radius:14px;padding:10px 12px}
.kp b{display:block;font-size:17px;color:var(--g);font-weight:800}
.kp span{font-size:11px;color:var(--tx2)}
.kp.w b{color:var(--gold)}.kp.d b{color:var(--red)}
.emp{text-align:center;color:var(--tx2);padding:40px 24px;font-size:14px;line-height:1.8}
.emp .btn{margin-top:10px}
.bnr{margin:0 12px 10px;background:rgba(245,185,50,.12);border:1px solid var(--gold);color:var(--gold);border-radius:12px;padding:10px 12px;font-size:12px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.cnt{font-size:11px;color:var(--tx3);padding:0 16px 6px}
.lb{font-size:12px;color:var(--tx2);margin:10px 2px 4px;display:block;font-weight:600}
.seg{display:flex;background:var(--p3);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;color:var(--tx2);padding:9px 4px;border-radius:10px;font:700 13px var(--ff)}
.seg button.on{background:var(--g);color:#04150d}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:50}
.ov.on{display:flex;animation:fi .2s}
@keyframes fi{from{opacity:0}to{opacity:1}}
.sh{width:100%;max-height:94%;background:var(--p2);border-radius:20px 20px 0 0;display:flex;flex-direction:column;border-top:2px solid var(--g);animation:su .25s}
@keyframes su{from{transform:translateY(40px)}to{transform:none}}
.gh{width:42px;height:4px;background:var(--ln2);border-radius:4px;margin:8px auto 0;flex:none}
.sht{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;flex:none}
.sht b{font-size:16px}
.x{border:0;background:var(--p4);color:var(--tx);width:34px;height:34px;border-radius:50%;font-size:16px}
.shb{overflow-y:auto;padding:0 16px calc(18px + env(safe-area-inset-bottom));flex:1}
.ctr{align-items:center;justify-content:center;padding:24px}
.ctr .sh{border-radius:20px;border:1px solid var(--ln2);max-width:340px;max-height:80%}
.ifw{position:absolute;inset:0;background:#6b7280;display:none;flex-direction:column;z-index:60}
.ifw.on{display:flex}
.ift{display:flex;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 10px 10px;background:var(--p1);border-bottom:2px solid var(--g)}
.ift .btn{flex:1;padding:11px 6px;font-size:13px}
#ifr{flex:1;border:0;background:#6b7280;width:100%}
#toasts{position:absolute;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;z-index:99;pointer-events:none;display:flex;flex-direction:column;gap:8px}
.ts{background:var(--p4);border:1px solid var(--g);color:var(--tx);padding:11px 14px;border-radius:12px;font-size:13px;font-weight:700;animation:fu .25s;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.ts.e{border-color:var(--red);color:var(--red)}
.cl{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.cl .nm{font-weight:800;font-size:14px}
.cl .rf{font:600 11px monospace;direction:ltr;text-align:right;color:var(--tx3)}
.qs{display:flex;align-items:center;gap:6px;background:var(--p3);border-radius:10px;padding:2px}
.qs button{width:34px;height:34px;border:0;border-radius:8px;background:var(--p4);color:var(--tx);font-size:18px;font-weight:700}
.qs b{min-width:28px;text-align:center}
.pi{width:110px;padding:8px;font-size:14px;text-align:center}
.lt{font-weight:800;color:var(--g);text-align:left}
.warn{color:var(--red);font-size:11px;font-weight:700;grid-column:1/-1}
.sum{flex:none;background:var(--p1);border-top:1px solid var(--ln);padding:10px 12px;transition:all .3s}
.sum .tt{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.sum .tt b{font-size:22px;color:var(--g);font-weight:800}
.sum small{color:var(--tx2);font-size:12px}
.pkl{margin:6px 12px 0;background:var(--p2);border:1px solid var(--ln2);border-radius:12px;overflow:hidden}
.pkl:empty{display:none}
.pki{padding:10px 12px;border-bottom:1px solid var(--ln);font-size:13px;display:flex;justify-content:space-between;gap:8px;cursor:pointer}
.pki:last-child{border:0}
.pki:active{background:var(--p3)}
.pki small{color:var(--tx3);font-family:monospace;direction:ltr}
.day{font-size:12px;font-weight:800;color:var(--tx2);padding:8px 16px 6px}
.sc{display:flex;justify-content:space-between;gap:10px;cursor:pointer}
.sc .a{font-weight:800}.sc .b{font-size:12px;color:var(--tx2);margin-top:2px}
.sc .t{font-weight:800;color:var(--g);text-align:left;white-space:nowrap}
.sc.v{opacity:.5}.sc.v .t{text-decoration:line-through}
.sg{margin:0 12px 10px;background:var(--p2);border:1px solid var(--ln);border-radius:14px;overflow:hidden}
.sgh{display:flex;justify-content:space-between;align-items:center;padding:14px;font-weight:800;cursor:pointer}
.sgh i{font-style:normal;color:var(--tx3);transition:transform .2s}
.sg.on .sgh i{transform:rotate(180deg)}
.sgb{display:none;padding:0 14px 14px}
.sg.on .sgb{display:block}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--ln);font-size:13px}
.kv:last-child{border:0}.kv span{color:var(--tx2)}.kv b{text-align:left}
.hint{font-size:12px;color:var(--tx3);line-height:1.7;margin-top:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tl{font-size:12px;color:var(--tx2);line-height:1.9}
.tl b{color:var(--g)}
.mg{font-size:12px;font-weight:700;margin-top:6px;color:var(--g)}
.mg.n{color:var(--red)}
.qrc{width:min(280px,100%);height:auto;aspect-ratio:1;image-rendering:pixelated;border-radius:14px;display:block;margin:12px auto;background:#fff}
@media (max-width:360px){.pi{width:92px}}
</style>
</head>
<body>
<div id="app">

<!-- ============ البحث ============ -->
<section class="scr on" id="s-search">
  <div class="hdr">
    <div class="brand">المعتمد<small>AL MOUTAMAD · Stock</small></div>
    <div class="hb"><button class="cp" id="b-cur-1" onclick="togCur()">DA</button><button class="cp" id="b-th-1" onclick="togTheme()">☀️</button><button class="cp" id="b-lock-1" onclick="lockBtn()">🔓</button><button class="cp" id="b-set-1" onclick="go('set')">⚙️</button></div>
  </div>
  <div class="sb"><input id="q" class="in big" type="search" placeholder="🔍 قطعة · مرجع · سيارة / Pièce · Réf" oninput="rS()" autocomplete="off"></div>
  <div class="chips" id="fch"></div>
  <div class="scrl" id="res"></div>
</section>

<!-- ============ البيع ============ -->
<section class="scr" id="s-sell">
  <div class="hdr">
    <div class="brand">بيع سريع<small>Vente · Bon de vente</small></div>
    <div class="hb"><button class="cp" id="b-cur-2" onclick="togCur()">DA</button><button class="cp" id="b-th-2" onclick="togTheme()">☀️</button><button class="cp" id="b-lock-2" onclick="lockBtn()">🔓</button><button class="cp" id="b-set-2" onclick="go('set')">⚙️</button></div>
  </div>
  <div class="sb"><input id="sq" class="in big" type="search" placeholder="➕ ابحث لإضافة قطعة إلى الوصل" oninput="pkRender('sq','spk',addCartPick)" autocomplete="off"></div>
  <div class="pkl" id="spk" style="margin-bottom:6px"></div>
  <div class="scrl" id="cart" style="padding-bottom:12px"></div>
  <div class="sum" id="csum"></div>
</section>

<!-- ============ المخزن ============ -->
<section class="scr" id="s-stock">
  <div class="hdr">
    <div class="brand">المخزن العام<small>Stock · Inventaire</small></div>
    <div class="hb"><button class="cp" id="b-cur-3" onclick="togCur()">DA</button><button class="cp" id="b-th-3" onclick="togTheme()">☀️</button><button class="cp" id="b-lock-3" onclick="lockBtn()">🔓</button><button class="cp" id="b-set-3" onclick="go('set')">⚙️</button></div>
  </div>
  <div class="scrl" id="stk"></div>
</section>

<!-- ============ السجل ============ -->
<section class="scr" id="s-hist">
  <div class="hdr">
    <div class="brand">السجل<small>Historique</small></div>
    <div class="hb"><button class="cp" id="b-cur-4" onclick="togCur()">DA</button><button class="cp" id="b-th-4" onclick="togTheme()">☀️</button><button class="cp" id="b-lock-4" onclick="lockBtn()">🔓</button><button class="cp" id="b-set-4" onclick="go('set')">⚙️</button></div>
  </div>
  <div class="scrl" id="his"></div>
</section>

<!-- ============ الإعدادات ============ -->
<section class="scr" id="s-set">
  <div class="hdr">
    <div class="brand">الإعدادات<small>Paramètres</small></div>
    <div class="hb"><button class="cp" id="b-th-5" onclick="togTheme()">☀️</button><button class="cp" id="b-lock-5" onclick="lockBtn()">🔓</button></div>
  </div>
  <div class="scrl" id="set"></div>
</section>

<button class="fab" id="fab" onclick="addPart()">+</button>

<nav class="nav">
  <button id="n-search" class="on" onclick="go('search')"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>بحث</button>
  <button id="n-sell" onclick="go('sell')"><svg viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 11.4a1 1 0 001 .6h8.8a1 1 0 001-.8L20 7H6"/></svg>بيع<span class="bdg" id="cbd">0</span></button>
  <button id="n-stock" onclick="go('stock')"><svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>المخزن</button>
  <button id="n-hist" onclick="go('hist')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>السجل</button>
  <button id="n-set" onclick="go('set')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>إعدادات</button>
</nav>

<!-- ============ Overlays (الترتيب = ترتيب الطبقات) ============ -->
<div class="ov" id="ov-part"><div class="sh"><div class="gh"></div><div class="sht"><b id="pt-t">القطعة</b><button class="x" onclick="cl('ov-part')">✕</button></div><div class="shb" id="pt-b"></div></div></div>
<div class="ov" id="ov-form"><div class="sh"><div class="gh"></div><div class="sht"><b id="fm-t">قطعة جديدة</b><button class="x" onclick="cl('ov-form')">✕</button></div><div class="shb" id="fm-b"></div></div></div>
<div class="ov" id="ov-supply"><div class="sh"><div class="gh"></div><div class="sht"><b>توريد · Approvisionnement</b><button class="x" onclick="cl('ov-supply')">✕</button></div><div class="shb" id="sp-b"></div></div></div>
<div class="ov" id="ov-sale"><div class="sh"><div class="gh"></div><div class="sht"><b id="sl-t">وصل</b><button class="x" onclick="cl('ov-sale')">✕</button></div><div class="shb" id="sl-b"></div></div></div>
<div class="ov" id="ov-rep"><div class="sh"><div class="gh"></div><div class="sht"><b>تقارير PDF</b><button class="x" onclick="cl('ov-rep')">✕</button></div><div class="shb" id="rp-b"></div></div></div>
<div class="ov" id="ov-brands"><div class="sh"><div class="gh"></div><div class="sht"><b>🚗 أنواع السيارات</b><button class="x" onclick="cl('ov-brands');dls()">✕</button></div><div class="shb" id="br-b"></div></div></div>
<div class="ov" id="ov-qr"><div class="sh"><div class="gh"></div><div class="sht"><b>▦ باركود التطبيق</b><button class="x" onclick="cl('ov-qr')">✕</button></div><div class="shb" id="qr-b"></div></div></div>
<div class="ov ctr" id="ov-new"><div class="sh"><div class="sht"><b>🆕 ما الجديد</b><button class="x" onclick="cl('ov-new')">✕</button></div><div class="shb" id="nw-b"></div></div></div>
<div class="ov ctr" id="ov-upd"><div class="sh"><div class="shb" id="up-b" style="padding-top:18px"></div></div></div>
<div class="ov ctr" id="ov-pin"><div class="sh"><div class="sht"><b id="pn-t">الرمز</b><button class="x" onclick="cl('ov-pin')">✕</button></div><div class="shb" id="pn-b"></div></div></div>
<div class="ov ctr" id="ov-ask" style="z-index:70"><div class="sh"><div class="shb" id="ak-b" style="padding-top:18px"></div></div></div>
<div class="ifw" id="ov-iframe">
  <div class="ift"><button class="btn btn-g" id="pdfb" onclick="dlPDF()">تحميل PDF</button><button class="btn" onclick="prDoc()">طباعة</button><button class="btn" onclick="cl('ov-iframe')">إغلاق</button></div>
  <iframe id="ifr" title="doc"></iframe>
</div>
<div id="toasts"></div>
</div>

<datalist id="dl-brand"></datalist>
<datalist id="dl-shelf"></datalist>

<script src="libs/html2canvas.min.js"></script>
<script src="libs/jspdf.umd.min.js"></script>
<script src="libs/qrcode.js"></script>
<script>
'use strict';
/* ================= الثوابت والبيانات ================= */

/* ================= البحث الذكي (عربي/فرنسي) ================= */
function nz(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ًͯ-ٰٟـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[^\p{L}\p{N}\s.\-\/]/gu,' ').replace(/\s+/g,' ').trim()}
const nr=s=>nz(s).replace(/[\s.\-\/]/g,'');
const rx=s=>s.replace(/[.*+?^${}()|[\]\\\-\/]/g,'\\$&');
const SYNR=SYN.map(g=>g.map(nz));
const stripAl=t=>t.length>4&&t.startsWith('ال')?t.slice(2):t;
function expand(nq){
  const alts=new Set([nq]);let n=0;
  for(const g of SYNR){
    for(const ph of g){
      const re=new RegExp('(^| )'+rx(ph)+'( |$)');
      if(re.test(nq)){g.forEach(o=>{if(o!==ph)alts.add(nq.replace(re,(m,a,b)=>a+o+b))});n++;break}
    }
    if(n>=3)break;
  }
  return [...alts];
}
function hay(p){let h=HC.get(p.id);if(!h){const s=nz([p.name,p.ref,p.brand,p.models,p.shelf,p.note].join(' '));h={s,c:s.replace(/[\s.\-\/]/g,''),r:nr(p.ref)};HC.set(p.id,h)}return h}
function srch(q,list){
  const nq=nz(q).split(' ').filter(Boolean).map(stripAl).join(' ');
  if(!nq)return list.slice();
  const alts=expand(nq).map(a=>a.split(' ').filter(Boolean));
  const out=[];
  for(const p of list){
    const h=hay(p);let sc=0;
    for(const a of alts){
      const ok=a.every(t=>{const tc=t.replace(/[.\-\/]/g,'');return h.s.includes(t)||((/\d/.test(t)||t.length>=4)&&h.c.includes(tc))});
      if(ok){const ex=a.some(t=>h.r&&h.r===t.replace(/[.\-\/]/g,''));const pr=a.some(t=>h.r&&t.length>=3&&h.r.includes(t.replace(/[.\-\/]/g,'')));sc=Math.max(sc,ex?3:pr?2:1)}
    }
    if(sc)out.push([p,sc]);
  }
  out.sort((x,y)=>(y[1]-x[1])||((tot(y[0])>0)-(tot(x[0])>0)));
  return out.map(x=>x[0]);
}

function dayLbl(t){const n=new Date(),s=new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime();return t>=s?'اليوم · '+fd(t):t>=s-864e5?'أمس · '+fd(t):fd(t)}
function rHist(){
  const el=$('#his'),see=canSee();
  const n=new Date(),s0=new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime();
  const td=D.sales.filter(s=>!s.void&&s.ts>=s0);
  const T=td.reduce((a,s)=>a+s.total,0),P=td.reduce((a,s)=>a+saleProfit(s),0);
  let h=`<div class="kpis" style="margin-top:10px"><div class="kp"><b>${td.length}</b><span>وصولات اليوم</span></div><div class="kp"><b>${money(T)}</b><span>مبيعات اليوم</span></div>${see?`<div class="kp w" style="grid-column:1/-1"><b>${money(P)}</b><span>ربح اليوم</span></div>`:''}</div>
  <div class="row" style="padding:0 12px 8px"><button class="btn" onclick="openRep()">📄 تقارير PDF</button></div>
  <div class="chips"><div class="seg" style="width:100%"><button class="${HT==='sales'?'on':''}" onclick="HT='sales';rHist()">المبيعات</button><button class="${HT==='sups'?'on':''}" onclick="HT='sups';rHist()">التوريد</button></div></div>`;
  const L=(HT==='sales'?D.sales:D.sups).slice().sort((a,b)=>b.ts-a.ts).slice(0,150);
  if(!L.length)h+=`<div class="emp">لا توجد عمليات بعد</div>`;
  let last='';
  for(const x of L){
    const dl=dayLbl(x.ts);if(dl!==last){h+=`<div class="day">${dl}</div>`;last=dl}
    if(HT==='sales'){

function impBackup(inp){
  const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=async()=>{
    try{
      const j=JSON.parse(r.result);if(!j||!Array.isArray(j.parts)||!Array.isArray(j.sales))throw 0;

      if(!y){inp.value='';return}
      D=j;const d=def();for(const k in d)if(D[k]===undefined)D[k]=d[k];for(const k in d.set)if(D.set[k]===undefined)D.set[k]=d.set[k];
      UNLOCK=false;SD();document.body.classList.toggle('light',D.set.theme==='light');toast('تم الاستيراد');rAll();
    }catch(e){toast('ملف غير صالح','e')}

  };r.readAsText(f);
}

function openPin(mode){

async function pinOk(mode){
  const o=$('#pn-o')?$('#pn-o').value:'',n=$('#pn-n')?$('#pn-n').value:'',n2=$('#pn-n2')?$('#pn-n2').value:'';
  if(mode!=='set'&&hp(o)!==D.set.pin){toast('رمز خاطئ','e');return}
  if(mode==='unlock'){UNLOCK=true;cl('ov-pin');toast('🔓 تم الفتح');rAll();return}
  if(mode==='remove'){D.set.pin='';D.set.rec='';UNLOCK=false;SD();cl('ov-pin');toast('أُلغي الرمز');rAll();return}
  if(n.length<4||!/^\d+$/.test(n)){toast('الرمز: 4 أرقام على الأقل','e');return}
  if(n!==n2){toast('الرمزان غير متطابقين','e');return}
  const code=String(Math.floor(100000+Math.random()*900000));
  D.set.pin=hp(n);D.set.rec=hp(code);UNLOCK=true;SD();cl('ov-pin');rAll();
  await ask('تم حفظ الرمز.\n\nرمز الاسترجاع (دوّنه الآن، لن يظهر مرة أخرى):\n'+code+'\n\nيُستعمل إذا نسيت الرمز.','تم، دوّنته',false,true);
}

function showDoc(inner,fmt,name){
  CURFMT=fmt;CURNAME=name;

  f.srcdoc=`<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><style>${DCSS}@media print{@page{size:${fmt==='a5'?'A5':'A4'};margin:0}}</style></head><body>${inner}</body></html>`;

function fitIfr(){
  const f=$('#ifr'),d=f.contentDocument;if(!d||!d.body)return;
  const w=f.clientWidth||390,pw=PW[CURFMT][0]+24;
  d.body.style.zoom=Math.min(1.2,w/pw);
}
function prDoc(){
  const f=$('#ifr');if(!f.contentDocument)return;
  f.contentDocument.body.style.zoom=1;
  try{f.contentWindow.focus();f.contentWindow.print()}catch(e){toast('تعذّرت الطباعة','e')}
  setTimeout(fitIfr,600);
}
async function dlPDF(){
  const f=$('#ifr'),d=f.contentDocument,btn=$('#pdfb');if(!d)return;
  const pgs=[...d.querySelectorAll('.page')];if(!pgs.length)return;
  btn.disabled=true;btn.textContent='جارٍ الإنشاء...';
  try{
    if(d.fonts&&d.fonts.ready)await Promise.race([d.fonts.ready,new Promise(r=>setTimeout(r,2500))]);
    d.body.style.zoom=1;
    const {jsPDF}=window.jspdf,W=CURFMT==='a5'?148:210,H=CURFMT==='a5'?210:297;
    const pdf=new jsPDF({unit:'mm',format:CURFMT,orientation:'p',compress:true});
    for(let i=0;i<pgs.length;i++){
      const c=await html2canvas(pgs[i],{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false});
      if(i)pdf.addPage(CURFMT,'p');
      pdf.addImage(c.toDataURL('image/jpeg',.92),'JPEG',0,0,W,H);
    }

let SWREG=null,UPD_REQ=false;
const vc=(a,b)=>{const x=a.split('.').map(Number),y=b.split('.').map(Number);for(let i=0;i<3;i++){const d=(x[i]||0)-(y[i]||0);if(d)return d}return 0};
function initSW(){
  if(!('serviceWorker' in navigator))return;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(UPD_REQ){UPD_REQ=false;location.reload()}});
  navigator.serviceWorker.register('sw.js').then(reg=>{
    SWREG=reg;
    if(reg.waiting&&navigator.serviceWorker.controller)showUpd();
    reg.addEventListener('updatefound',()=>{
      const nw=reg.installing;
      if(nw)nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)setTimeout(()=>{if(reg.waiting)showUpd()},500)});
    });
    setInterval(()=>reg.update().catch(()=>{}),3600000);
  }).catch(()=>{});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&SWREG)SWREG.update().catch(()=>{})});
}
function showUpd(){
  if($('#ov-upd').classList.contains('on'))return;
  $('#up-b').innerHTML=`<div style="font-size:32px;text-align:center">🔄</div><div style="font-weight:800;font-size:16px;text-align:center;margin:6px 0">تحديث جديد متوفر</div><div style="font-size:13px;color:var(--tx2);text-align:center;line-height:1.8;margin-bottom:14px">يوجد إصدار أحدث من «المعتمد». بياناتك محفوظة ولن تتأثر بالتحديث.</div><div class="row"><button class="btn" onclick="cl('ov-upd')">لاحقاً</button><button class="btn btn-g" onclick="doUpd()">تحديث الآن</button></div>`;
  ov('ov-upd');
}
function doUpd(){
  const w=SWREG&&SWREG.waiting;
  UPD_REQ=true;
  if(w){w.postMessage({type:'SKIP_WAITING'});setTimeout(()=>{if(UPD_REQ)location.reload()},4000)}
  else location.reload();
}
async function checkUpd(){
  if(!SWREG){toast('التحديث التلقائي غير متاح في هذا المتصفح','e');return}
  toast('جارٍ التحقق من التحديث...');
  try{await SWREG.update()}catch(e){toast('تعذّر التحقق (تأكد من الإنترنت)','e');return}
  setTimeout(()=>{
    if(SWREG.waiting)showUpd();
    else if(SWREG.installing)toast('جارٍ تنزيل التحديث...');
    else toast('أنت على أحدث إصدار ✓');
  },1200);
}
function showNew(auto){
  const seen=D.set.seenVer;
  let L=CHANGELOG;
  if(auto)L=seen?CHANGELOG.filter(c=>vc(c.v,seen)>0):CHANGELOG.slice(0,1);
  if(!L.length)L=CHANGELOG.slice(0,1);
  $('#nw-b').innerHTML=`<div style="text-align:center;font-weight:800;margin-bottom:10px;color:var(--g)">الإصدار v${APP_VERSION} · نوفمبر 2026</div>`+
    L.map(c=>`<div class="card" style="margin:0 0 8px"><div style="font-weight:800;margin-bottom:4px">v${c.v} <span style="color:var(--tx3);font-weight:600;font-size:12px">· ${c.d}</span></div><div class="tl">${c.items.map(i=>'• '+esc(i)).join('<br>')}</div></div>`).join('')+
    `<button class="btn btn-g btn-fw" style="margin-top:6px" onclick="cl('ov-new')">حسناً</button>`;
  D.set.seenVer=APP_VERSION;SD();
  ov('ov-new');
}
function chkNew(){
  if(!D.set.seenVer&&!D.parts.length&&!D.sales.length){D.set.seenVer=APP_VERSION;SD();return}
  if(D.set.seenVer!==APP_VERSION)setTimeout(()=>showNew(true),700);
}

/* ================= الإقلاع ================= */
LD();
document.body.classList.toggle('light',D.set.theme==='light');
dls();bdg();go('search');
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
initSW();chkNew();
</script>
